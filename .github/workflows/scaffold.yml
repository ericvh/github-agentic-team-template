name: Scaffold

on:
  push:
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate scaffold
        run: bash scripts/check-scaffold.sh

  spec-exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run named spec-exercise command
        run: bash scripts/run-named-spec-exercise.sh

